<div class="ft-list">

  <!--Only first 8 categories-->
  @for(cat of filteredCategories.slice(0, 8); track cat.id; let i = $index){
  <div data-cy="categoryItem" class="ft-item">
    <span class="ft-index" aria-hidden="true">{{ (i + 1).toString().padStart(2, '0') }}</span>

    <div class="ft-text">
      <h3 class="ft-name">
        <button data-cy="viewService" type="button" class="ft-link" (click)="searchByCategory(cat)">
          {{ cat.name }}
          <span class="sr-only">— {{ 'DASHBOARD._view_serv' | translate }}</span>
        </button>
      </h3>
      @if (cat?.description) {
      <markdown class="ft-desc" [data]="cat.description"></markdown>
      }
    </div>

    <span class="ft-arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </span>
  </div>
  } @empty {
  <p class="ft-empty">
    {{ 'DASHBOARD._not_found' | translate }}
  </p>
  }
</div>
