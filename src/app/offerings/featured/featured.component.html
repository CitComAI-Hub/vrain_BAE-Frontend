<div class="pt-6">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">

    <!--Only first 8 categories-->
    @for(cat of filteredCategories.slice(0, 8); track cat.id){
    <div data-cy="categoryItem"
      class="group flex flex-col w-full h-full p-5 bg-white rounded-xl border border-gray-200 shadow-sm transition duration-200 hover:-translate-y-1 hover:border-gray-300 hover:shadow-md">
      <span class="mb-3 h-1 w-8 rounded-full bg-primary-50" aria-hidden="true"></span>
      <a class="cursor-pointer">
        <h5
          class="text-lg font-bold leading-tight line-clamp-2 tracking-tight text-primary-100 text-wrap break-words">
          {{cat.name}}</h5>
      </a>
      <markdown class="mt-2 min-h-19 h-19 line-clamp-4 text-sm text-gray-600">
        {{cat?.description}}
      </markdown>

      <div class="mt-auto pt-5">
        <button data-cy="viewService" type="button" (click)="searchByCategory(cat)"
          class="inline-flex w-full items-center justify-center text-white bg-primary-100 hover:bg-black focus:ring-4 focus:outline-none focus:ring-gray-300 font-semibold rounded-lg text-sm px-5 py-2.5 text-center transition-colors">
          <svg class="w-[18px] h-[18px] mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 20 14">
            <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
              <path d="M10 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
              <path d="M10 13c4.97 0 9-2.686 9-6s-4.03-6-9-6-9 2.686-9 6 4.03 6 9 6Z" />
            </g>
          </svg>
          {{ 'DASHBOARD._view_serv' | translate }}
        </button>
      </div>
    </div>
    } @empty {
    <div class="col-span-full py-10 text-center text-gray-500">
      {{ 'DASHBOARD._not_found' | translate }}
    </div>
    }
  </div>
</div>
