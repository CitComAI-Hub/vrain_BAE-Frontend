<div class="acc-page">
  <app-account-header title="My inventory"
    subtitle="The products, services and resources available to your account."></app-account-header>

  <div class="acc-layout">
    <aside class="acc-aside">
      <nav class="acc-nav" aria-label="Inventory sections">
        <p class="acc-nav-label">{{ 'PRODUCT_INVENTORY._inventory' | translate }}</p>
        <button data-cy="inventoryProducts" id="prod-button" (click)="goToOffers()" type="button" class="acc-nav-item text-white bg-primary-100">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>
          {{ 'PRODUCT_INVENTORY._products' | translate }}
        </button>
        <button data-cy="inventoryServices" id="serv-button" (click)="getServices()" type="button" class="acc-nav-item">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
          {{ 'PRODUCT_INVENTORY._services' | translate }}
        </button>
        <button data-cy="inventoryResources" id="res-button" (click)="getResources()" type="button" class="acc-nav-item">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
          {{ 'PRODUCT_INVENTORY._resources' | translate }}
        </button>
      </nav>
    </aside>

    <div class="acc-main">
      @if(show_prods){
      <inventory-products [prodId]="openProdId"></inventory-products>
      }
      @if(show_serv){
      <inventory-services [serviceId]="openServiceId" [prodId]="openProdId"></inventory-services>
      }
      @if(show_res){
      <inventory-resources [resourceId]="openResourceId" [prodId]="openProdId"></inventory-resources>
      }
    </div>
  </div>
</div>
