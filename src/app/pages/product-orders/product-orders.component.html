<div class="acc-page">
  <app-account-header [title]="'PRODUCT_ORDERS._orders' | translate"
    subtitle="Track the orders you place and receive, and check their invoices."></app-account-header>

  <div class="acc-layout">
    <aside class="acc-aside">
      <nav class="acc-nav" aria-label="Order sections">
        <p class="acc-nav-label">Orders</p>
        <button (click)="goToOrders()" id="order-button" type="button" class="acc-nav-item">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg>
          {{ 'PRODUCT_ORDERS._orders' | translate }}
        </button>
        <button data-cy="invoices" (click)="goToInvoices()" id="bill-button" type="button" class="acc-nav-item">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
          {{ 'PRODUCT_ORDERS._invoices' | translate }}
        </button>
      </nav>
    </aside>

    <div class="acc-main">
      @if(show_orders){
      <app-order-info></app-order-info>
      }
      @if(show_invoices){
      <app-invoices-info></app-invoices-info>
      }
    </div>
  </div>
</div>
