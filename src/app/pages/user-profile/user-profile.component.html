<div class="acc-page">
  <app-account-header [title]="'PROFILE._profile' | translate"
    subtitle="Your personal details, billing addresses and payment settings."></app-account-header>

  <div class="acc-layout">
    <aside class="acc-aside">
      <nav class="acc-nav" aria-label="Profile sections">
        <p class="acc-nav-label">Account</p>
        @if(loggedAsUser){
        <button (click)="getProfile()" id="general-button" type="button" class="acc-nav-item text-white bg-primary-100">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          {{ 'PROFILE._general' | translate }}
        </button>
        } @else {
        <button (click)="getOrgProfile()" id="general-button" type="button" class="acc-nav-item text-white bg-primary-100">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16M14 9h5a1 1 0 0 1 1 1v11M2 21h20M8 8h2M8 12h2M8 16h2"/></svg>
          {{ 'PROFILE._general' | translate }}
        </button>
        }
        <button (click)="getBilling()" id="bill-button" type="button" class="acc-nav-item">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
          {{ 'PROFILE._bill' | translate }}
        </button>

        <p class="acc-nav-label">Payments</p>
        <button (click)="getRevenue()" id="revenue-button" type="button" class="acc-nav-item">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>
          {{ 'PROFILE._revenue' | translate }}
        </button>
        <button (click)="getPayment()" id="payment-button" type="button" class="acc-nav-item">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
          {{ 'PROFILE._payment_dashboard' | translate }}
          <svg class="acc-nav-icon acc-nav-ext" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </button>

        <p class="acc-nav-label">Credentials</p>
        <button (click)="getLear()" id="lear-button" type="button" class="acc-nav-item">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 17a3.5 3.5 0 0 1 7 0M14 10h4M14 14h4"/></svg>
          {{ 'PROFILE._lear_link' | translate }}
          <svg class="acc-nav-icon acc-nav-ext" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </button>
      </nav>
    </aside>

    <div class="acc-main">
      @if(show_profile){
      <user-info></user-info>
      }
      @if(show_org_profile){
      <org-info></org-info>
      }
      @if(show_orders){
      <order-info></order-info>
      }
      @if(show_billing){
      <billing-info></billing-info>
      }
      @if(show_revenue){
      <provider-revenue-sharing></provider-revenue-sharing>
      }
    </div>
  </div>
</div>
