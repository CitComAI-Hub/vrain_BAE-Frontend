<div class="acc-page">
  <app-account-header [title]="'ADMIN._admin' | translate"
    subtitle="Manage categories, verification, revenue sharing and email settings."></app-account-header>

  <div class="acc-layout">
    <aside class="acc-aside">
      <nav class="acc-nav" aria-label="Administration sections">
        <p class="acc-nav-label">Administration</p>
        <button (click)="goToCategories()" id="categories-button" type="button" class="acc-nav-item text-white bg-primary-100">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          {{ 'ADMIN._categories' | translate }}
        </button>
        <button (click)="goToVerification()" id="verify-button" type="button" class="acc-nav-item">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v6c0 4.2 3 7.6 7 9 4-1.4 7-4.8 7-9V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
          {{ 'ADMIN._verification' | translate }}
        </button>
        <button (click)="goToRevenue()" id="revenue-button" type="button" class="acc-nav-item">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>
          {{ 'ADMIN._revenue' | translate }}
        </button>
        <button (click)="goToEmail()" id="email-button" type="button" class="acc-nav-item">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          {{ 'ADMIN._email' | translate }}
        </button>
      </nav>
    </aside>

    <div class="acc-main">
      @if(show_categories){
      <admin-categories></admin-categories>
      }
      @if(show_create_categories){
      <create-category></create-category>
      }
      @if(show_update_categories){
      <update-category [category]="category_to_update"></update-category>
      }
      @if(show_verification){
      <verification></verification>
      }
      @if(show_revenue){
      <operator-revenue-sharing></operator-revenue-sharing>
      }
      @if(show_email){
      <email></email>
      }
    </div>
  </div>
</div>
