<div class="acc-page">
  <app-account-header [title]="'USAGE_SPECS._usage_spec' | translate"
    subtitle="Create and manage the usage specifications of your offers."></app-account-header>

  <div class="acc-layout">
    <aside class="acc-aside">
      <nav class="acc-nav" aria-label="Usage specification sections">
        <p class="acc-nav-label">Selling</p>
        <button (click)="goToUsageSpec()" id="catalogs-button" type="button" class="acc-nav-item text-white bg-primary-100">
          <svg class="acc-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 15 12-12 6 6-12 12-6-6Z"/><path d="m7 11 2 2M10 8l2 2M13 5l2 2"/></svg>
          {{ 'USAGE_SPECS._list' | translate }}
        </button>
      </nav>
    </aside>

    <div class="acc-main">
      @if(show_usage_specs){
      <usage-list></usage-list>
      }
      @if(show_create_usage){
      <create-usage-spec></create-usage-spec>
      }
      @if(show_update_usage){
      <update-usage-spec [usageSpec]="usageSpecToUpdate"></update-usage-spec>
      }
    </div>
  </div>
</div>
